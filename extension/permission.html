<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Meet Minutes Pro — Enable Microphone Access</title>
  <style>
    /* Premium visual theme matching styles.css but optimized for full-screen layout */
    :root {
      --bg-app: linear-gradient(135deg, #09090f 0%, #030305 100%);
      --glass-bg: rgba(18, 18, 29, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --color-success: #10b981;
      --color-danger: #ef4444;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-app);
      color: var(--text-main);
      font-family: var(--font-family);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glows */
    .glow-circle-1 {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.08);
      filter: blur(100px);
      z-index: 1;
      pointer-events: none;
    }

    .glow-circle-2 {
      position: absolute;
      bottom: 15%;
      right: 15%;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(79, 70, 229, 0.08);
      filter: blur(100px);
      z-index: 1;
      pointer-events: none;
    }

    .permission-card {
      position: relative;
      z-index: 10;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: card-appear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes card-appear {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      width: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #ffffff;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
    }

    .logo-text h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.4px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .separator {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin: 8px 0;
    }

    .icon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.25);
      margin: 12px 0;
    }

    .mic-icon-svg {
      color: #c084fc;
      width: 32px;
      height: 32px;
    }

    h2 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .btn-start {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      border-radius: 14px;
      border: 1px solid rgba(16, 185, 129, 0.1);
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
      filter: brightness(1.08);
    }

    .btn-start:active {
      transform: translateY(0);
    }

    .success-icon {
      color: var(--color-success);
      width: 36px;
      height: 36px;
    }

    .success-bg {
      background: rgba(16, 185, 129, 0.1) !important;
      border-color: rgba(16, 185, 129, 0.25) !important;
    }

    .pulse-glow {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-ring {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4);
      }
      50% {
        box-shadow: 0 0 0 12px rgba(139, 92, 246, 0);
      }
    }
  </style>
</head>
<body>

  <!-- Background decorative elements -->
  <div class="glow-circle-1"></div>
  <div class="glow-circle-2"></div>

  <!-- Onboarding Content Card -->
  <div class="permission-card" id="card">
    <div class="logo-area">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
      </div>
      <div class="logo-text">
        <h1>Meet Minutes Pro</h1>
      </div>
    </div>
    
    <div class="separator"></div>

    <div class="icon-wrapper pulse-glow" id="iconWrapper">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mic-icon-svg" id="micIcon"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
    </div>

    <h2>Enable Microphone Access</h2>
    <p>To record and mix your voice into meeting summaries in real-time, Meet Minutes Pro requires microphone permission for this extension.</p>
    <p style="font-size: 11px; margin-top: -10px;">Please click the button below and then click <strong>Allow</strong> in the browser prompt.</p>

    <button id="grantBtn" class="btn-start">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
      Grant Microphone Permission
    </button>
  </div>

  <script src="permission.js"></script>
</body>
</html>
